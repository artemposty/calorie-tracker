<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <!-- Dark base -->
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>

    <!-- Glass inner surface: cool dark tint with depth -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2c3a" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#14141a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#08080b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Specular reflection top-left (caustic bright spot) -->
    <radialGradient id="spec" cx="0.22" cy="0.12" r="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Diagonal glass shine band -->
    <linearGradient id="shine" x1="0" y1="0" x2="0.9" y2="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle blue depth glow (visionOS tint) -->
    <radialGradient id="depth" cx="0.5" cy="0.65" r="0.55">
      <stop offset="0%" stop-color="#3a6fff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#3a6fff" stop-opacity="0"/>
    </radialGradient>

    <!-- Letter soft glow -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.45" result="c"/>
      <feComposite in="c" in2="blur" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip to icon shape -->
    <clipPath id="shape">
      <rect width="192" height="192" rx="42"/>
    </clipPath>
  </defs>

  <!-- Dark base -->
  <rect width="192" height="192" rx="42" fill="url(#base)"/>

  <!-- Inner glass layer -->
  <rect clip-path="url(#shape)" x="0" y="0" width="192" height="192" fill="url(#glass)"/>

  <!-- Subtle blue depth -->
  <rect clip-path="url(#shape)" x="0" y="0" width="192" height="192" fill="url(#depth)"/>

  <!-- Diagonal shine -->
  <rect clip-path="url(#shape)" x="0" y="0" width="192" height="192" fill="url(#shine)"/>

  <!-- Caustic specular highlight -->
  <rect clip-path="url(#shape)" x="0" y="0" width="192" height="192" fill="url(#spec)"/>

  <!-- Glass edge: top + left bright, bottom + right dark shadow -->
  <rect x="1" y="1" width="190" height="190" rx="41.5" fill="none"
        stroke="white" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Inner inset edge (glass thickness illusion) -->
  <rect x="8" y="8" width="176" height="176" rx="36" fill="none"
        stroke="white" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Bottom/right shadow edge (makes it feel 3D) -->
  <rect x="1" y="1" width="190" height="190" rx="41.5" fill="none"
        stroke="#000000" stroke-opacity="0.35" stroke-width="1"
        style="paint-order:stroke"/>

  <!-- Letter Т with soft glow -->
  <text x="97" y="132"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="90" font-weight="700" letter-spacing="-2"
        fill="white" fill-opacity="0.96" text-anchor="middle"
        filter="url(#glow)">Т</text>
</svg>
