<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2c3a" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#14141a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#08080b" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="spec" cx="0.22" cy="0.12" r="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="0.9" y2="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="depth" cx="0.5" cy="0.65" r="0.55">
      <stop offset="0%" stop-color="#3a6fff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#3a6fff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.45" result="c"/>
      <feComposite in="c" in2="blur" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="shape">
      <rect width="180" height="180" rx="40"/>
    </clipPath>
  </defs>

  <rect width="180" height="180" rx="40" fill="url(#base)"/>
  <rect clip-path="url(#shape)" x="0" y="0" width="180" height="180" fill="url(#glass)"/>
  <rect clip-path="url(#shape)" x="0" y="0" width="180" height="180" fill="url(#depth)"/>
  <rect clip-path="url(#shape)" x="0" y="0" width="180" height="180" fill="url(#shine)"/>
  <rect clip-path="url(#shape)" x="0" y="0" width="180" height="180" fill="url(#spec)"/>

  <rect x="1" y="1" width="178" height="178" rx="39.5" fill="none"
        stroke="white" stroke-opacity="0.22" stroke-width="1.5"/>
  <rect x="7" y="7" width="166" height="166" rx="34" fill="none"
        stroke="white" stroke-opacity="0.07" stroke-width="1"/>
  <rect x="1" y="1" width="178" height="178" rx="39.5" fill="none"
        stroke="#000000" stroke-opacity="0.35" stroke-width="1"/>

  <text x="91" y="124"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="84" font-weight="700" letter-spacing="-2"
        fill="white" fill-opacity="0.96" text-anchor="middle"
        filter="url(#glow)">Т</text>
</svg>
